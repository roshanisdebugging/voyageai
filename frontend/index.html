<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cruiser</title>
  <meta name="description"
    content="Simple, elderly-friendly travel assistant to discover destinations, plan trips, explore maps, book stays, and manage expenses." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <!-- Prevent theme flash (FOUC) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('cruiser_theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Web Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
</head>

<body
  class="bg-[#F6F7F5] dark:bg-zinc-950 text-[#1F2522] dark:text-zinc-100 font-sans antialiased overflow-x-hidden selection:bg-[#355F58] selection:text-white transition-colors">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
